<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrazione App di streaming Musicale</title>
</head>
<body>
    <h1>Registrazione App di streaming Musicale</h1>
    <form onsubmit="alert('Registrazione Inviata!')">
        <div>
            <input type="text" placeholder="Nome">
        </div>
         <div>
            <input type="text" placeholder="Cognome">
        </div>
         <div>
            <input type="email" placeholder="Il tuo indirizzo email">
        </div>
         <div>
            <input type="password" placeholder="Password">
        </div>
         <div>
            Data di Nascita<input type="date" placeholder="Data di Nascita">
        </div>
         <div>
            <input type="number" placeholder="Numero di telefono">
        </div>
        Scegli i tuoi generi musicali preferiti:
        <div>
            <input type="checkbox"> Classica
            <input type="checkbox"> Jazz
            <input type="checkbox"> Rock
            <input type="checkbox"> Indie
            <input type="checkbox"> Rap
            <input type="checkbox"> Pop
        </div>
         <div>
            <input type="radio"> Accettazione dei termini e Condizione
        </div>
         <div>
            <button type="submit">Registrati</button>
        </div>

    </form>
</body>
</html>
